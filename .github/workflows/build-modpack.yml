name: Build modpack

on:
  workflow_run:
    workflows: ["Sync with upstream"]
    types: [completed]
  push:
    branches: [custom-26.2, rso-26.2]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  workflows: write

jobs:
  build:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && matrix.branch == github.ref_name) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - branch: custom-26.2
            pkg: Fabulously.Optimized-custom-26.2.mrpack
            release: custom-latest-build
            reltitle: "Fabulously Optimized (personal) — MC 26.2"
            tag: last-built
            artifact: custom-26.2
          - branch: rso-26.2
            pkg: Fabulously.Optimized-rso-26.2.mrpack
            release: rso-latest-build
            reltitle: "Fabulously Optimized (personal) — MC 26.2 RSO 生电整合"
            tag: last-built-rso-26.2
            artifact: rso-26.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.branch }}

      - name: Check changes since last build
        id: check
        run: |
          if git rev-parse origin/${{ matrix.tag }} >/dev/null 2>&1 && [ "$(git rev-parse origin/${{ matrix.tag }})" = "$(git rev-parse HEAD)" ]; then
            echo "No changes since last build; skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packwiz
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -sL -o packwiz.zip "https://github.com/starxjys/fabulously-optimized/releases/download/packwiz-cli/packwiz-linux-amd64.zip"
          unzip -o packwiz.zip -d packwiz
          chmod +x packwiz/packwiz

      - name: Stamp build version
        if: steps.check.outputs.changed == 'true'
        run: |
          sed -i "s/^version = \"\(.*\)\"/version = \"\1+custom-$(date -u +%Y%m%d)\"/" Packwiz/26.2/pack.toml
          echo "PKG_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Packwiz/26.2/pack.toml)" >> "$GITHUB_ENV"

      - name: Export mrpack
        if: steps.check.outputs.changed == 'true'
        run: |
          cd Packwiz/26.2
          ../../packwiz/packwiz modrinth export -o ../../${{ matrix.pkg }}

      - name: Publish to GitHub Release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ matrix.release }} >/dev/null 2>&1 || gh release create ${{ matrix.release }} --title "${{ matrix.reltitle }}" --notes "init"
          if [ "${{ matrix.branch }}" = "rso-26.2" ]; then
            {
              echo "${{ matrix.reltitle }}"
              echo ""
              echo "- 构建: $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "- 版本: ${PKG_VER}"
              echo "- commit: $(git rev-parse --short HEAD)"
              echo ""
              echo "基于 custom-26.2（去 Cape Provider，加 CustomSkinLoader/voxy/Chat Heads/OneKeyMiner），"
              echo "整合 RSO 生电优化（红石/技术向）mod 集，小地图由 Xaero 换为 JourneyMap。"
              echo ""
              echo "HMCL 导入: 下载本文件 → 版本列表 → 导入 Modrinth 包"
            } > notes.md
          else
            {
              echo "${{ matrix.reltitle }}"
              echo ""
              echo "- 构建: $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "- 版本: ${PKG_VER}"
              echo "- commit: $(git rev-parse --short HEAD)"
              echo ""
              echo "自定义差异（相对上游）："
              echo "- 移除: Cape Provider"
              echo "- 新增: CustomSkinLoader, voxy, Chat Heads, Xaero's Minimap, Xaero's World Map, OneKeyMiner"
              echo ""
              echo "HMCL 导入: 下载本文件 → 版本列表 → 导入 Modrinth 包"
            } > notes.md
          fi
          gh release edit ${{ matrix.release }} --notes-file notes.md
          gh release upload ${{ matrix.release }} ${{ matrix.pkg }} --clobber

      - name: Upload artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error

      - name: Update last-built tag
        if: steps.check.outputs.changed == 'true'
        run: |
          git tag -f ${{ matrix.tag }} HEAD
          git push origin ${{ matrix.tag }} --force

      - name: Clean up old artifacts
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDs=$(gh api "repos/starxjys/fabulously-optimized/actions/artifacts?name=${{ matrix.artifact }}" --jq '.artifacts[] | select(.workflow_run.id != '"'"'${{ github.run_id }}'"'"') | .id' 2>/dev/null || true)
          for id in $IDs; do
            gh api --method DELETE "repos/starxjys/fabulously-optimized/actions/artifacts/$id"
          done
