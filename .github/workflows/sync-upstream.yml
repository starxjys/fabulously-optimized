name: Sync with upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/Fabulously-Optimized/fabulously-optimized.git
          git fetch upstream main

      - name: Merge upstream into fork main
        run: |
          git checkout main
          git merge --no-edit upstream/main
          git push origin main

      - name: Merge upstream into custom-26.2
        run: |
          git fetch origin custom-26.2
          git checkout -B custom-26.2 origin/custom-26.2
          git merge --no-edit upstream/main
          git push origin custom-26.2
